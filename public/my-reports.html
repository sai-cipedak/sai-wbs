<body>
<header><div class="container header-inner"><a class="brand" href="index.html">SAI Cipedak</a><div class="pill">Laporan Saya</div></div></header>
<main class="container">
  <section id="loginPanel" class="form-card compact-form" hidden>
    <h1 class="internal-title">Laporan Saya</h1>

    <button id="googleLogin" class="primary" type="button">Masuk dengan Google</button>

      <div><h1 class="internal-title">Laporan Saya</h1><p id="userLabel" class="muted"></p></div>

    <div class="internal-grid">
      <aside class="case-list-panel"><h2>Daftar Laporan</h2><div id="reportList" class="case-list" aria-live="polite"></div></aside>

    </div>
  </section>

<footer class="container">SAI Cipedak · Portal Pelaporan</footer>
