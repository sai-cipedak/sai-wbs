<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Workspace Sekretariat DS untuk pembentukan Tim Pemeriksa, review hasil, dan tindak lanjut." />
  <title>Sekretariat DS — Portal Pelaporan SAI Cipedak</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20260830-2" />
  <script src="assets/js/config.js"></script>
  <script type="module" src="assets/js/portal-shell.js?v=20260903-1"></script>
</head>
<body>
<header><div class="container header-inner"><a class="brand" href="index.html">SAI Cipedak</a><div class="pill">Sekretariat DS</div></div></header>
<main class="container">
  <section id="loginPanel" class="form-card compact-form" hidden>
    <h1 class="internal-title">Sekretariat DS</h1>
    <p>Masuk dengan akun Google yang memiliki kewenangan Sekretariat DS.</p>
    <button id="googleLogin" class="primary" type="button">Masuk dengan Google</button>
    <div id="loginMessage" class="form-message" hidden></div>
  </section>

  <section id="dashboardPanel" hidden>
    <div class="internal-toolbar">
      <div><p class="eyebrow">Workspace internal</p><h1 class="internal-title">Sekretariat DS</h1><p class="muted" id="userLabel"></p></div>
      <div class="action-row"><a class="button secondary" href="followup.html">Follow-up Pasca Penutupan</a><button id="refreshButton" type="button" class="secondary">Segarkan</button><button id="logoutButton" type="button" class="text-button">Keluar</button></div>
    </div>
    <div id="pageMessage" class="form-message internal-message" hidden></div>
    <div class="internal-grid">
      <aside class="case-list-panel"><h2>Kasus Sekretariat</h2><div id="caseList" class="case-list"></div></aside>
      <section id="caseDetail" class="case-detail"><p class="empty-state">Pilih laporan untuk melihat detail.</p></section>
    </div>
  </section>
</main>
<footer class="container">SAI Cipedak · Portal Pelaporan</footer>
<script type="module" src="assets/js/secretariat.js?v=20260901-2"></script>
</body>
