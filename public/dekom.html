<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Workspace Dekom untuk pengambilalihan kasus konflik dan retaliation." />
  <title>Dekom — Portal Pelaporan SAI Cipedak</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20260904-2" />
  <style>
    /* Dekom-only visual treatment: keep Secretariat layout untouched. */
    #caseDetail .team-member-card {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid #d6dce5;
      border-radius: 16px;
      background: #f9fbfd;
      box-shadow: 0 2px 8px rgba(16, 24, 40, .05);
      gap: 0;
    }
    #caseDetail .team-member-card .status-head {
      align-items: center;
      padding-bottom: 13px;
      margin-bottom: 13px;
      border-bottom: 1px solid #e4e7ec;
    }
    #caseDetail .team-member-card .status-head strong {
      font-size: 17px;
      line-height: 1.35;
    }
    #caseDetail .team-member-card > p {
      margin: 0;
      padding: 4px 0;
    }
    #caseDetail .team-member-card > p.muted {
      font-size: 13px;
    }
    #caseDetail .team-member-card > p:not(.muted):not(.assignment-active) {
      margin-top: 3px;
      font-size: 14px;
      word-break: break-word;
    }
    #caseDetail .team-member-card .assignment-active {
      margin-top: 8px;
      padding: 9px 11px;
      border-radius: 9px;
      background: #f0fdf4;
    }
    #caseDetail .team-member-card .text-button {
      width: 100%;
      justify-self: stretch;
      text-align: left;
      margin-top: 12px;
      padding: 12px 0 0;
      border-top: 1px solid #e4e7ec;
      border-radius: 0;
    }
    @media (max-width: 760px) {
      #caseDetail .team-member-card .status-head {
        align-items: flex-start;
        gap: 10px;
      }
      #caseDetail .team-member-card .status-badge {
        align-self: flex-start;
      }
    }
  </style>
  <script src="assets/js/config.js"></script>
  <script type="module" src="assets/js/portal-shell.js?v=20260904-1"></script>
</head>
<body>
<header><div class="container header-inner"><a class="brand" href="index.html">SAI Cipedak</a><div class="pill">Dekom</div></div></header>
<main class="container">
  <section id="loginPanel" class="form-card compact-form" hidden>
    <h1 class="internal-title">Dewan Komunitas</h1>
    <p>Masuk dengan akun Google yang memiliki kewenangan Dekom.</p>
    <button id="googleLogin" class="primary" type="button">Masuk dengan Google</button>
    <div id="loginMessage" class="form-message" hidden></div>
  </section>
  <section id="dashboardPanel" hidden>
    <div class="internal-toolbar">
      <div><p class="eyebrow">Workspace internal</p><h1 class="internal-title">Dewan Komunitas</h1><p class="muted" id="userLabel"></p></div>
      <div class="action-row"><a class="button secondary" href="dekom-followup.html">Follow-up Pasca Penutupan</a><button id="refreshButton" type="button" class="secondary">Segarkan</button><button id="logoutButton" type="button" class="text-button">Keluar</button></div>
    </div>
    <div id="pageMessage" class="form-message internal-message" hidden></div>
    <div class="internal-grid">
      <aside class="case-list-panel"><h2>Kasus Dekom</h2><div id="caseList" class="case-list"></div></aside>
      <section id="caseDetail" class="case-detail"><p class="empty-state">Pilih kasus untuk melihat detail.</p></section>
    </div>
  </section>
</main>
<footer class="container">SAI Cipedak · Portal Pelaporan</footer>
<script type="module" src="assets/js/dekom.js?v=20260826-2315"></script>
</body>
</html>
